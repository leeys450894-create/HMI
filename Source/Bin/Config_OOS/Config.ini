[PROBE_AUTO_CONTACT]
; LYS 2026-08-10 AutoContact Phase 4 (values migrated from OCP Config - PROBE Z(P5) re-teaching required on the real machine)
; use flags: ContactDataCntUse 1=auto contact / 0=recipe contact params
ContactDataCntUse=0
ContactDataAlways=0
ContactDataModelChange=0
ContactDataProbeChange=0
; search parameters
; ReadyPos: search start Z / FirstLimitPos: step-1 max Z / FirstMoveGap: contact search step (<=0.5)
; SecondMoveGap: OD search step (<=0.1) / ODMax: OD limit (<=1.0) / Percent: R-Test pass ratio (0~100)
; PortFail: allowed bad-signal-line cell count / AddOD: extra OD after search (<=0.5)
ReadyPos=6.9000
FirstLimitPos=7.2000
FirstMoveGap=0.1000
SecondMoveGap=0.0500
ODMax=0.7000
Percent=80.0000
PortFail=1.0000
AddOD=0.2500
; search result state (written by the app - do not edit)
ContactDataSucess=1
ContactDataReady=6.9000
ContactDataPos1=6.9000
ContactDataPos2=0.0000
ContactDataRcpID=UNKNOWN
ContactDataProbeID=TEST5

[PROBE_MCOFF]
; LYS 2026-09-23 Probe Z emergency retract on MC 101 (EQ MOTION) OFF - CMotionProbeToMcOffMove
; USE: 1 = monitor on / RETRACT_POS: target Z (mm, same as UnContact 0) / PG_OFF: send PG Turn Off after retract
; LOOP_MS: monitor period (ms). MC bit comes from PLC M scan cache (~250ms), so detection is 0.25~0.5s
USE=1
RETRACT_POS=0.0
PG_OFF=1
LOOP_MS=20
